<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>瑞興國小校本課程介紹</title>
<meta name="description" content="瑞興國小校本課程互動網站：雲海上的天空之城「濱海綠寶石群島」，六座浮空島帶你走過一到六年級的校訂課程。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M20 6h24l14 18-26 34L6 24z' fill='%232fa36b'/%3E%3Cpath d='M20 6l12 18 12-18M6 24h52M32 24v34' stroke='%23d8f7e4' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fffaf0; --cream:#fbf3e3; --ink:#3f3a2a; --muted:#857a5f; --line:#e6dcc0;
  --gem:#2f9a62; --gem-soft:#dff3e6; --sea:#2f7fb0; --gold:#c8902e; --gold-soft:#fbefd6;
  --accent:var(--gem); --accent-soft:var(--gem-soft);
  --shadow:0 10px 28px rgba(50,60,30,.18); --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe6f5;color:var(--ink);
  font-family:"Noto Sans TC",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none}
.card{background:rgba(255,250,240,.93);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* ---------- top bar ---------- */
.brand{position:fixed;top:14px;left:14px;display:flex;align-items:center;gap:12px;padding:8px 18px 8px 10px;z-index:20;max-width:calc(100vw - 28px)}
.brand .logo{width:52px;height:52px;flex:none;border-radius:14px;background:linear-gradient(145deg,#4cc28a,#1f7a4c);display:grid;place-items:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.brand .logo svg{width:34px;height:34px}
.brand h1{margin:0;font:900 20px/1.2 "Noto Serif TC",serif;letter-spacing:.04em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand h1 em{font:700 11px/1 "Noto Sans TC";font-style:normal;background:var(--gem);color:#fff;padding:4px 8px;border-radius:999px;letter-spacing:.05em}
.brand p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.quote{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;z-index:19;max-width:430px}
.quote .tag{flex:none;background:var(--gem);color:#fff;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px}
.quote p{margin:0;font:600 15px/1.45 "Noto Serif TC",serif;min-width:210px}
.iconbtn{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;font-size:14px}
.iconbtn:hover{background:var(--cream)}
.music-pill{position:fixed;top:14px;right:232px;display:flex;align-items:center;gap:8px;padding:9px 16px;z-index:20;font-weight:700;font-size:14px;transition:transform .2s,background .2s;border-radius:999px}
.music-pill:hover{transform:scale(1.05);background:#fff}
.music-pill.playing{background:var(--gem-soft);border-color:var(--gem);color:#1f6b45}
.music-pill.playing .m-icon{animation:spin 3s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
#confettiCanvas{position:fixed;inset:0;pointer-events:none;z-index:99;display:none}
.clock{position:fixed;top:14px;right:14px;display:flex;align-items:center;gap:14px;padding:10px 16px;z-index:20}
.clock b{display:block;font:900 20px/1.1 "Noto Serif TC",serif}
.clock small{font-size:12px;color:var(--muted)}
.clock .sky{display:flex;align-items:center;gap:8px;padding-left:14px;border-left:1px solid var(--line)}
.clock .sky span{font-size:24px}

/* ---------- labels ---------- */
#labels{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
body.nolabels #labels{display:none}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;border:0;background:none;padding:0;will-change:transform}
.lbl>span{display:flex;align-items:center;gap:6px;padding:5px 12px 5px 8px;background:var(--paper);border:2px solid var(--c);border-radius:999px;
  font-weight:700;font-size:14px;white-space:nowrap;box-shadow:0 4px 10px rgba(40,50,20,.22);transition:transform .2s,background .2s,color .2s}
.lbl i{width:22px;height:22px;border-radius:50%;background:var(--c);flex:none;color:#fff;font-style:normal;font-size:12px;display:grid;place-items:center;font-weight:900}
.lbl small{font-weight:500;color:var(--muted);font-size:11px}
.lbl.hub>span{font:900 17px/1.2 "Noto Serif TC",serif;background:var(--c);color:#fff;padding:7px 16px 7px 10px}
.lbl.hub i{background:#fff;color:var(--c)}
.lbl.hub small{color:rgba(255,255,255,.85);font-family:"Noto Sans TC"}
.lbl:hover>span,.lbl.on>span{transform:scale(1.08)}
.lbl.on:not(.hub)>span{background:var(--c);color:#fff}
.lbl.on:not(.hub) small{color:rgba(255,255,255,.85)}
.lbl.on:not(.hub) i{background:#fff;color:var(--c)}
.lbl .stamp{font-size:11px;margin-left:2px;font-style:normal}

/* ---------- bottom-left ---------- */
.passport{position:fixed;left:14px;bottom:78px;padding:12px 14px;z-index:20;width:300px}
.passport header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.passport header b{font:900 15px "Noto Serif TC",serif}
.passport header span{font-size:12px;color:var(--muted)}
.stamps{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.stamp-dot{aspect-ratio:1;border-radius:50%;border:1.5px dashed #c9bb94;background:transparent;font-size:12px;font-weight:700;color:#b3a37c;display:grid;place-items:center;padding:0}
.stamp-dot.got{border:2px solid var(--c);background:var(--c);color:#fff;transform:rotate(-8deg)}
.gems{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);font-size:12.5px}
.gems b{color:var(--gem);font-size:15px}
.gems .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.gems .bar i{display:block;height:100%;background:linear-gradient(90deg,#57c98d,#1f8a55);width:0;transition:width .4s}
.hint{margin:8px 0 0;font-size:12px;color:var(--muted);line-height:1.5}
.actions{position:fixed;left:14px;bottom:18px;display:flex;gap:8px;z-index:20}
.pill{border:0;border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:6px;text-decoration:none}
.pill.gem{background:var(--gem);color:#fff}
.pill.sea{background:var(--sea);color:#fff}
.pill:hover{filter:brightness(1.07)}

/* ---------- dock ---------- */
.dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px;z-index:20}
.seg{display:flex;gap:2px;padding:4px}
.seg button{border:0;background:none;padding:7px 13px;border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap}
.seg button:hover{background:var(--cream)}
.seg button.on{background:var(--ink);color:#fff}
.seg button.tog.on{background:var(--gem);color:#fff}

/* ---------- panel ---------- */
.panel{position:fixed;top:92px;right:14px;bottom:78px;width:440px;z-index:30;display:flex;flex-direction:column;overflow:hidden;
  transform:translateX(calc(100% + 30px));transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.panel.open{transform:none}
.p-head{padding:14px 18px 0;background:linear-gradient(180deg,var(--accent-soft),rgba(255,250,240,0))}
.p-nav{display:flex;align-items:center;gap:6px}
.p-nav .crumb{font-size:12px;font-weight:700;color:var(--accent);background:#fff;border:1px solid var(--line);padding:4px 10px;border-radius:999px}
.p-nav .sp{flex:1}
.p-head h2{margin:10px 0 2px;font:900 26px/1.25 "Noto Serif TC",serif;letter-spacing:.03em}
.p-head .sub{margin:0;font-size:15px;font-weight:700}
.p-head .meta{margin:4px 0 0;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:2px;padding:12px 14px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:8px 11px 10px;font-size:14px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);font-weight:700;border-color:var(--accent)}
.p-body{flex:1;overflow:auto;padding:16px 18px;font-size:14.5px;line-height:1.75}
.p-body h4{margin:16px 0 6px;font:900 15px "Noto Serif TC",serif;display:flex;align-items:center;gap:6px}
.p-body h4::before{content:"";width:6px;height:16px;border-radius:3px;background:var(--accent)}
.p-body p{margin:0 0 8px}
.hero{margin:0 0 12px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--cream);position:relative}
.hero img{display:block;width:100%;height:220px;object-fit:cover}
.hero figcaption{position:absolute;left:10px;bottom:10px;background:rgba(40,50,30,.72);color:#fff;font-size:12px;padding:3px 10px;border-radius:999px}
.lead{font-size:15px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 4px}
.facts div{background:var(--accent-soft);border-radius:12px;padding:8px 6px;text-align:center}
.facts b{display:block;font:900 16px/1.3 "Noto Serif TC",serif;color:var(--accent)}
.facts span{font-size:11px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:13px;padding:3px 10px;border-radius:999px;background:#fff;border:1px solid var(--line)}
.chips span.k{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:700}
.units{list-style:none;margin:0;padding:0;position:relative}
.units::before{content:"";position:absolute;left:15px;top:14px;bottom:14px;width:2px;background:var(--line)}
.units li{position:relative;display:flex;gap:12px;padding:8px 0}
.units li>span{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px;position:relative}
.units li b{display:block;font-size:14.5px}
.units li small{display:block;color:var(--muted);font-size:13px;line-height:1.6}
.units li em{display:inline-block;font-style:normal;font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:1px 8px;border-radius:999px;margin-top:3px}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gallery.portrait{grid-template-columns:repeat(3,1fr)}
.shot{border:1px solid var(--line);border-radius:12px;overflow:hidden;padding:0;background:#fff;text-align:left;position:relative;transition:transform .2s}
.shot:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.shot img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--cream)}
.gallery.portrait .shot img{aspect-ratio:3/4}
.shot span{position:absolute;left:6px;top:6px;background:rgba(40,50,30,.72);color:#fff;font-size:11px;padding:1px 8px;border-radius:999px}
.linkrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px dashed var(--line);background:#fff;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13.5px;text-decoration:none}
.linkrow:hover{border-style:solid;border-color:var(--accent)}
.linkrow img{width:52px;height:52px;border-radius:8px;object-fit:cover;flex:none}
.linkrow .ic{width:52px;height:52px;border-radius:10px;flex:none;background:var(--accent-soft);display:grid;place-items:center;font-size:24px}
.linkrow b{display:block;font-size:14.5px}
.linkrow small{display:block;color:var(--muted);font-size:12px}
.linkrow .go{margin-left:auto;color:var(--accent);font-weight:900}
.point{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.point>b{flex:none;width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:13px}
.matrix{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;line-height:1.5}
.matrix th,.matrix td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.matrix th{font-size:11.5px;color:var(--muted);font-weight:700}
.matrix td:first-child{font-weight:900;white-space:nowrap}
.matrix tr[data-go]{cursor:pointer}
.matrix tr[data-go]:hover td{background:var(--accent-soft)}
.dotc{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:1px}
.p-foot{padding:12px 18px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:150px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 14px;border-radius:12px;font-weight:700;text-decoration:none;border:1px solid var(--line);background:#fff;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:hover{filter:brightness(1.05)}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(30,40,25,.4);display:none;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}
.listbox{width:min(1080px,100%);max-height:100%;overflow:auto;padding:20px 22px 24px}
.listbox header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.listbox h3{margin:0;font:900 22px "Noto Serif TC",serif}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.tile{border:1px solid var(--line);background:#fff;border-radius:14px;overflow:hidden;padding:0;text-align:left;transition:transform .2s,box-shadow .2s;border-top:5px solid var(--c)}
.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.tile img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:var(--cream)}
.tile div{padding:8px 12px 12px}
.tile small{font-size:11.5px;color:var(--muted)}
.tile b{display:block;font:900 16px/1.35 "Noto Serif TC",serif}
.tile p{margin:3px 0 0;font-size:12.5px;color:var(--muted);line-height:1.55}
.lightbox .lb-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:min(1200px,100%)}
.lightbox img{max-width:100%;max-height:calc(100vh - 190px);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.4);background:#fff}
.lb-text{max-width:760px;color:#fff;font-size:15px;line-height:1.7;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.6);margin:0}
.lb-bar{display:flex;gap:8px;align-items:center;color:#fff;font-size:14px;flex-wrap:wrap;justify-content:center}
.lb-bar button{border:0;background:rgba(255,250,240,.95);border-radius:999px;padding:7px 14px;font-weight:700}

/* ---------- tour & toast ---------- */
.tourbar{position:fixed;top:92px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:10px;padding:8px 10px 8px 16px;z-index:25;font-size:14px}
.tourbar.on{display:flex}
.tourbar .prog{width:120px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.tourbar .prog i{display:block;height:100%;background:var(--gem);width:0}
.tourbar button{border:0;border-radius:999px;padding:5px 12px;background:var(--cream);font-weight:700;font-size:13px}
.toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-20px);opacity:0;z-index:60;padding:10px 18px;font-weight:700;pointer-events:none;transition:all .35s;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- loader ---------- */
.loader{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,#fbf6e4 0%,#cfe8f3 55%,#93c6e6 100%);transition:opacity .8s}
.loader.hide{opacity:0;pointer-events:none}
.loader .box{width:min(420px,calc(100vw - 40px));text-align:center;padding:28px 26px 22px}
.loader small{letter-spacing:.3em;color:var(--muted);font-size:12px}
.loader .gemicon{width:96px;height:96px;margin:14px auto 4px;display:block}
.loader h2{margin:6px 0 4px;font:900 28px "Noto Serif TC",serif;letter-spacing:.06em}
.loader p{margin:0;color:var(--muted)}
.loader .bar{height:8px;border-radius:4px;background:var(--line);margin:18px 0 8px;overflow:hidden}
.loader .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#57c98d,#2f9a62,#2f7fb0);transition:width .3s}
.loader .step{font-size:13px;color:var(--muted)}
.loader .skip{margin-top:10px;border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline}
.float{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}

/* ---------- responsive ---------- */
@media (max-width:1180px){ .quote{display:none} }
@media (max-width:760px){
  .music-pill{top:auto;bottom:70px;right:96px;padding:6px 12px;font-size:12px;gap:4px}
  .music-pill .m-txt{display:none}
  .brand{top:8px;left:8px;padding:6px 12px 6px 8px;gap:8px}
  .brand .logo{width:38px;height:38px;border-radius:10px} .brand .logo svg{width:24px;height:24px}
  .brand h1{font-size:16px} .brand p{display:none}
  .clock{top:auto;bottom:70px;right:8px;padding:6px 10px;gap:8px}
  .clock>div:first-child{display:none} .clock .sky{border:0;padding:0}
  .passport{display:none}
  .actions{left:8px;bottom:70px}
  .pill{padding:8px 12px;font-size:13px}
  .dock{left:8px;right:8px;bottom:10px;transform:none;overflow-x:auto;scrollbar-width:none}
  .dock::-webkit-scrollbar{display:none}
  .seg button{padding:7px 10px;font-size:13px}
  .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:64vh;transform:translateY(calc(100% + 20px))}
  .panel .p-head h2{font-size:21px}
  .lbl>span{font-size:12px;padding:3px 9px 3px 4px} .lbl small{display:none}
  .lbl.hub>span{font-size:14px}
  .tiles{grid-template-columns:1fr 1fr}
  .gallery.portrait{grid-template-columns:1fr 1fr}
  .tourbar{top:62px}
}
@media (prefers-reduced-motion:reduce){ .float{animation:none} }
</style>

</script>

<body>
<div id="stage"></div>
<div id="labels"></div>

<header class="brand card">
  <div class="logo"><svg viewBox="0 0 64 64"><path d="M20 6h24l14 18-26 34L6 24z" fill="#bff0d4"/><path d="M20 6l12 18 12-18M6 24h52M32 24v34" stroke="#2f9a62" stroke-width="3" fill="none"/></svg></div>
  <div>
    <h1>瑞興國小校本課程介紹 <em>天空之城</em></h1>
    <p>濱海綠寶石｜一至六年級・六座浮空島</p>
  </div>
</header>

<div class="quote card" aria-live="polite">
  <span class="tag">島嶼小語</span>
  <p id="quoteText">大樹守護我們，黑豆滋養我們。</p>
  <button class="iconbtn" id="quoteBtn" aria-label="換一句">↻</button>
</div>

<button class="music-pill card" id="bgmBtn" aria-label="播放背景音樂" title="點擊開啟/暫停背景音樂">
  <span class="m-icon">🔇</span><span class="m-txt">背景音樂</span>
</button>
<canvas id="confettiCanvas"></canvas>

<div class="clock card">
  <div><b id="clkDate">—</b><small id="clkTime">—</small></div>
  <div class="sky"><span id="skyIcon">☀️</span><div><b id="skyName" style="font-size:16px">白晝</b><small id="skyMode">即時天色</small></div></div>
</div>

<section class="passport card" aria-label="島嶼護照">
  <header><b>🎒 綠寶石護照</b><span id="stampCount">已登島 0 / 6</span></header>
  <div class="stamps" id="stamps"></div>
  <div class="gems">💎 小綠寶石 <b id="gemCount">0</b>/<span id="gemTotal">12</span><div class="bar"><i id="gemBar"></i></div></div>

function select(isl, opts = {}) {
  if (!isl) return;
  if (selected && selected !== isl) { selected.el.classList.remove('on'); if (!opts.keepTab) curTab = 0; }
  selected = isl; isl.el.classList.add('on');
  if (isl.kind === 'grade') playIslandChime(isl.grade); else playTone(440, 'sine', .4, .1);
  renderPanel(isl);
  panelEl.classList.add('open'); panelEl.setAttribute('aria-hidden', 'false');
  flyTo(focusPose(isl), opts.dur || 1.4);
  if (isl.kind === 'grade') stamp(isl);
  try { history.replaceState(null, '', '#' + isl.id); } catch (e) {}
  setActiveView(null);
}
function closePanel(goBack = true) {
  panelEl.classList.remove('open'); panelEl.setAttribute('aria-hidden', 'true');

const lbOv = $('#lbOv'); let gallery = [], gi = 0;
function openLightbox(items, i = 0) { if (!items || !items.length) return; gallery = items; gi = i; showLb(); lbOv.classList.add('open'); }
function showLb() { const [src, cap] = gallery[gi]; $('#lbImg').src = src; $('#lbImg').alt = cap || ''; $('#lbText').textContent = cap || ''; $('#lbCap').textContent = `${gi + 1} / ${gallery.length}`; $('#lbPrev').style.visibility = $('#lbNext').style.visibility = gallery.length > 1 ? '' : 'hidden'; }

document.addEventListener('keydown', e => {
  if (lbOv.classList.contains('open')) {

    if (e.key === 'ArrowRight') $('#lbNext').click();

  if (listOv.classList.contains('open')) { if (e.key === 'Escape') listOv.classList.remove('open'); return; }
  if (e.key === 'Escape' && selected) { stopTour(); closePanel(); }
  if (selected && e.key === 'ArrowLeft') { stopTour(); step(-1); }

/* ---------- 綠寶石護照 ---------- */

  $('#stamps').innerHTML = COURSES.map(d => `<button class="stamp-dot ${stamps.has(d.id) ? 'got' : ''}" style="--c:${d.accent}" data-go="${d.id}" title="${GRADE[d.grade]}年級・${d.name}">${d.grade}</button>`).join('');

const TOUR_MS = 7500;

function startTour() {
  listOv.classList.remove('open');
  tour = { i:0, paused:false, start:performance.now(), elapsed:0 };
  $('#tourbar').classList.add('on'); $('#tourBtn').textContent = '■ 結束導覽';

}
function updTourText() { $('#tourText').textContent = `導覽中 ${tour.i + 1}/${ORDER.length}・${byId[ORDER[tour.i]].name}`; $('#tourPause').textContent = tour.paused ? '繼續' : '暫停'; }

  if (!tour) return;

  if (tour.elapsed > TOUR_MS) {

$('#tourBtn').onclick = () => tour ? stopTour() : startTour();

const WEEK = '日一二三四五六';

  $('#clkTime').textContent = `星期${WEEK[d.getDay()]}・${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;

/* =========================================================
   主迴圈
   ========================================================= */
const clock = new THREE.Clock(), vtmp = new THREE.Vector3();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime, now = performance.now();
  const target = timeMode === 0 ? nowHour() : TIME_MODES[timeMode].k;
  const diff = ((target - curHour + 36) % 24) - 12;
  curHour = (curHour + diff * Math.min(1, dt * 1.6) + 24) % 24;
  applySky(curHour);
  for (const isl of islands) {
    const want = (isl.hover || isl === selected) ? (isl.kind === 'grade' ? .7 : .4) : 0;
    isl.lift += (want - isl.lift) * Math.min(1, dt * 5);
    isl.group.position.y = isl.base.y + Math.sin(t * .55 + isl.phase) * (isl.kind === 'grade' ? .28 : .15) + isl.lift;
    isl.ring.material.opacity = (isl.hover || isl === selected) ? .55 + Math.sin(t * 4) * .25 : Math.max(0, isl.ring.material.opacity - dt * 2);
  }
  for (const f of updaters) f(t, dt);
  if (tween) {
    const k = Math.min(1, (now - tween.s) / tween.dur), e = ease(k);
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    controls.target.lerpVectors(tween.t0, tween.t1, e);
    camera.position.y += Math.sin(k * PI) * tween.p0.distanceTo(tween.p1) * .12;
    if (k >= 1) { tween = null; controls.enabled = true; }
  }
  controls.update();
  if (pointerDirty && !tween) { pointerDirty = false; const gm = pickGem(); if (gm) { setHover(null); renderer.domElement.style.cursor = 'pointer'; } else setHover(pick()); }
  tickTour(now);
  renderer.render(scene, camera);
  const W = innerWidth, H = innerHeight;
  for (const isl of islands) {
    vtmp.copy(isl.group.position); vtmp.y += isl.labelY; vtmp.project(camera);
    const vis = vtmp.z < 1 && Math.abs(vtmp.x) < 1.15 && Math.abs(vtmp.y) < 1.15;
    isl.el.style.visibility = vis ? 'visible' : 'hidden';
    if (vis) isl.el.style.transform = `translate(${(vtmp.x * .5 + .5) * W}px,${(-vtmp.y * .5 + .5) * H}px) translate(-50%,-100%)`;
  }
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

/* =========================================================
   開場
   ========================================================= */
const loadBar = $('#loadBar'), loadStep = $('#loadStep');
const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));
async function boot() {
  const steps = [['正在喚醒天空之城…', 10], ['升起六座浮空島…', 45], ['架設吊橋，藏好小綠寶石…', 70], ['放飛白雲與飛鳥…', 90]];
  const setStep = ([txt, p]) => { loadStep.textContent = txt; loadBar.style.width = p + '%'; };
  setStep(steps[0]);
  try { await Promise.race([document.fonts.load('900 64px "Noto Serif TC"', '瑞興國小濱海綠寶石大樹棟樑百歲宴固碳魔法環保皂工坊綠能未來藍碳低碳綠生活'), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
  setStep(steps[1]); await nextFrame();
  buildIslands();
  setStep(steps[2]); await nextFrame();
  buildBridges(); buildGems();
  setStep(steps[3]); await nextFrame();
  buildBirds(); renderStamps(); renderGems(); tickClock(); applySky(curHour);
  loop();
  loadBar.style.width = '100%'; loadStep.textContent = '準備完成，歡迎登島！';
  const finish = () => {
    if (finish.done) return; finish.done = true;
    $('#loader').classList.add('hide');
    const hashIsl = byId[location.hash.slice(1)];
    if (hashIsl) select(hashIsl, { dur:2.6 }); else flyTo(viewPose('overview'), 2.8);
  };
  $('#skipBtn').onclick = finish;
  setTimeout(finish, 900);
}
boot();
</script>
