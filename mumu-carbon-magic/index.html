<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>濱海小綠寶石：木木的固碳魔法</title>
<style>
:root{
  --desk:#3b2a20; --desk2:#5a4030; --paper:#fbf4e3; --ink:#3d2c1e; --accent:#c8552b;
  --hl:#ffdf8a; --cover:#2f6b4f; --gold:#f2c14e; --r:1.6;
  --kai:"DFKai-SB","標楷體","BiauKai","Kaiti TC","KaiTi","Noto Serif TC",serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 35%,var(--desk2),var(--desk));color:var(--ink);font-family:var(--kai);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px 16px;overflow:hidden}
.stage{width:min(100%,calc((100dvh - 96px)*2));aspect-ratio:2;container-type:size}
.book{position:relative;width:100%;height:100%;perspective:2400px;transition:transform .8s ease;cursor:pointer;user-select:none;touch-action:pan-y}
.book.at-front{transform:translateX(-25%)}
.book.at-back{transform:translateX(25%)}
.leaf{position:absolute;top:0;left:50%;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;
  transition:transform .85s cubic-bezier(.45,.05,.35,1),opacity .85s}
.leaf.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:var(--paper)}
.face.back{transform:rotateY(180deg)}
/* 書脊陰影 */
.face.front::after,.face.back::after{content:"";position:absolute;inset:0;pointer-events:none}
.face.front::after{background:linear-gradient(90deg,rgba(60,35,10,.28),transparent 7%)}
.face.back::after{background:linear-gradient(270deg,rgba(60,35,10,.28),transparent 7%)}
.face.front{border-radius:0 1.2cqw 1.2cqw 0;box-shadow:.3cqw .5cqw 1.5cqw rgba(0,0,0,.4)}
.face.back{border-radius:1.2cqw 0 0 1.2cqw;box-shadow:-.3cqw .5cqw 1.5cqw rgba(0,0,0,.4)}

.art{overflow:hidden;background:#e9dfc8}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.art .missing{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#8d7458;font-size:1.8cqw;padding:1em}
.art.plate{position:absolute;left:3%;right:3%;top:50%;transform:translateY(-50%);aspect-ratio:var(--r);border-radius:1cqw;box-shadow:0 0 0 .25cqw #d9c7a2,0 .4cqw 1.2cqw rgba(70,45,15,.25)}

.txt{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:7% 10% 9%}
.story{font-size:calc(2.75cqw*var(--fit,1));line-height:1.85;margin:0;text-align:justify}
.cue{border-radius:.4cqw;transition:background .25s;padding:.1em 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.cue.on{background:var(--hl)}
/* 注音：每字一格，符號直排在字的右側 */
.zy .story{text-align:left;line-height:1.5}
.zg{display:inline-flex;white-space:nowrap}
.zc{display:inline-flex;align-items:center;border-radius:.3cqw;transition:background .25s}
.cue.on .zc{background:var(--hl)}
.zc .bp{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:.42em;margin:0 .2em 0 .03em;font-size:1em;line-height:1}
.zc .bp i{font-style:normal;font-size:.42em;line-height:1}
.zc .bp .tn{position:absolute;left:78%;top:50%;transform:translateY(-50%);font-size:.42em}
.zc .bp .dot{font-size:.42em;line-height:.6}
.pno{position:absolute;bottom:4%;right:7%;font-size:1.6cqw;color:#8d7458}

.cover{position:absolute;inset:0;overflow:hidden;background:var(--cover);color:#fff8e6;text-align:center}
.cover .blur{position:absolute;inset:-6%;background-position:center;background-size:cover;filter:blur(2cqw) brightness(.8)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.cover .plain{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5cqw;padding:8%}
.cover h1{margin:0;font-size:4.5cqw;letter-spacing:.08em}
.cover p{margin:0;font-size:1.9cqw;color:var(--gold);letter-spacing:.08em}
.cover h1.ctitle{position:absolute;left:4%;right:4%;top:0;height:23%;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;font-size:3.8cqw;line-height:1.2;letter-spacing:0;color:#fff;text-shadow:0 .1cqw .5cqw rgba(0,0,0,.65)}
.backcover{position:absolute;inset:0;background:var(--cover);color:#fff8e6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqw;padding:10%;text-align:center}
.backcover h2{margin:0;font-size:3.4cqw;color:var(--gold)}
.backcover p{margin:0;font-size:2cqw;line-height:1.7}
.again{font:inherit;font-size:2cqw;padding:.7em 1.3em;border:0;border-radius:99px;background:var(--gold);color:var(--ink);cursor:pointer}

.end h2{font-size:3.6cqw;color:var(--accent);margin:0 0 .4em;letter-spacing:.08em}
.end .src{font-size:1.6cqw;color:#8d7458;margin:.9em 0 0}
.end ol{font-size:2.25cqw;line-height:1.6;margin:0;padding-left:1.4em}
.end ol li{margin-bottom:.7em}
.end .story{font-size:calc(2.35cqw*var(--fit,1));line-height:1.75}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;color:#fff8e6}
.bar button{font:inherit;font-size:17px;min-height:42px;padding:6px 14px;border:1px solid rgba(255,248,230,.45);border-radius:99px;background:rgba(255,248,230,.1);color:inherit;cursor:pointer}
.bar button:hover{background:rgba(255,248,230,.22)}
.bar button:disabled{opacity:.35;cursor:default}
.bar button.main{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:700}
.bar button[aria-pressed="false"]{opacity:.6;text-decoration:line-through}
.bar :focus-visible{outline:3px solid #fff;outline-offset:2px}
#label{min-width:5.5em;text-align:center;font-size:16px}

/* 直式手機：單頁模式，每頁上圖下文 */
body.single .stage{width:min(100%,calc((100dvh - 150px)*.68));aspect-ratio:.68}
body.single .leaf{left:0;width:100%}
body.single .leaf.flipped{transform:rotateY(-115deg);opacity:0;pointer-events:none}
body.single .face.front{border-radius:12px}
body.single .face.front::after{display:none}
body.single .sp{position:absolute;inset:0;display:flex;flex-direction:column}
body.single .art.top{position:relative;flex:none;width:100%;aspect-ratio:var(--r)}
body.single .art .missing{font-size:4cqw}
body.single .sp .txt{position:relative;inset:auto;flex:1;min-height:0;padding:5% 7% 10%;justify-content:flex-start}
body.single .story{font-size:calc(4.7cqw*var(--fit,1));line-height:1.65}
body.single.zy .story{font-size:calc(5.6cqw*var(--fit,1));line-height:1.45}
body.single .pno{font-size:3.4cqw}
body.single .cover h1{font-size:9cqw}
body.single .cover p{font-size:4.2cqw}
body.single .cover h1.ctitle{font-size:7.4cqw}
body.single .backcover h2{font-size:7.5cqw}
body.single .backcover p{font-size:4.6cqw}
body.single .again{font-size:4.6cqw}
body.single .end .txt{justify-content:flex-start;padding:7%}
body.single .end h2{font-size:7cqw}
body.single .end .story{font-size:calc(4.3cqw*var(--fit,1));line-height:1.6}
body.single .end .src{font-size:3.3cqw}
body.single .end ol{font-size:4cqw;margin-top:1em}
@media (prefers-reduced-motion:reduce){.leaf,.book{transition-duration:.01s}}
</style>
</head>
<body>
<div class="stage"><div class="book" id="book"></div></div>
<div class="bar">
  <button id="prev" aria-label="上一頁">◀ 上一頁</button>
  <button id="play" class="main">▶ 開始聽故事</button>
  <button id="next" aria-label="下一頁">下一頁 ▶</button>

</div>
<script>
const BOOK = {"title": "濱海小綠寶石：木木的固碳魔法", "subtitle": "濱海綠寶石校訂課程・三年級電子繪本", "cover_title": true, "closing": "一起當減碳小英雄！", "thanks": "濱海綠寶石校訂課程・國小三年級", "ratio": 1.339, "coverCues": [{"s": "濱海小綠寶石：木木的固碳魔法。", "t": 0.1}], "pages": [{"cues": [{"s": "太陽暖洋洋地照在美麗的海岸線上，小木麻黃「木木」迎著海風快樂地伸展枝條。", "t": 0.1}, {"s": "雖然海岸邊常常吹著大風、夾雜著鹹鹹的水霧，許多嬌弱的花草都害怕極了，但木木總是穿著一身綠油油的防禦外套，元氣滿滿地守護著海邊。", "t": 8.55}, {"s": "學習小提問：小朋友，你有去過海邊嗎？", "t": 22.68}, {"s": "海邊吹來的風是不是常常夾雜著鹹鹹的水氣呢？", "t": 27.66}]}, {"cues": [{"s": "有一天，洶湧的海風怪物呼呼地吹過沙灘，把漫天的沙粒和鹹鹽吹得四處飛散！", "t": 0.1}, {"s": "小草和小花都嚇得縮起了身子，只有木木把根深深地扎進沙土裡，挺直腰桿站立在風沙的最前線。", "t": 8.65}, {"s": "學習小提問：在強風襲擊下，為什麼木木可以站得這麼穩，不會隨便被吹倒呢？", "t": 18.85}]}, {"cues": [{"s": "「難道你不怕鹹鹹的水霧和強風嗎？」", "t": 0.1}, {"s": "風怪物好奇地問。", "t": 3.31}, {"s": "木木笑著展示自己細長的綠色小枝：「你看！", "t": 5.77}, {"s": "我看似針葉的構造其實是綠色小枝，真正的葉子早就退化成極小的鱗片葉包裹在節上，這樣就能減少水分蒸散，還能不怕鹽風呢！」", "t": 10.71}, {"s": "綠寶石知識庫：木麻黃看起來像針葉樹，但它其實是闊葉樹喔！", "t": 22.85}, {"s": "它退化的鱗片葉能保護自己不流失水分，並靠綠色小枝來進行光合作用。", "t": 29.67}]}, {"cues": [{"s": "木木還召集了許多木麻黃樹夥伴，一棵接著一棵緊緊排成一條長長的綠色長城。", "t": 0.1}, {"s": "有了這道堅固的防風林，狂暴的海風被擋了下來，飛揚的沙土也被牢牢固定在原地，保護了後方肥沃的農田與城鎮。", "t": 8.19}, {"s": "學習小提問：如果海岸邊沒有這條「綠色長城」，後方的農田與房子會發生什麼事呢？", "t": 19.54}]}, {"cues": [{"s": "住在海邊村莊的小女孩「晴晴」跑來到綠色長城下遊玩。", "t": 0.1}, {"s": "看到木木和樹木夥伴們守護了農田與家園，晴晴高興地伸出雙手歡呼：「謝謝你們！", "t": 6.49}, {"s": "木木，你們簡直是海岸邊最耀眼的綠寶石！」", "t": 15.33}, {"s": "學習小提問：如果你遇到守護家園的防風林大樹，你想對它們說些什麼感謝的話？", "t": 19.61}]}, {"cues": [{"s": "晴晴擦擦額頭上的汗水，好奇地問：「木木，為什麼最近夏天變得越來越熱了呢？」", "t": 0.1}, {"s": "木木溫柔地搖搖枝條說：「因為空氣中的二氧化碳（CO₂）太多了，地球有點發燒了。", "t": 7.73}, {"s": "不過，我們樹木可是擁有神奇的吸碳魔法喔！」", "t": 16.41}, {"s": "綠寶石知識庫：當人類排放過多的二氧化碳時，就會形成溫室效應，讓地球像蓋了厚棉被一樣發燒變熱。", "t": 20.9}]}, {"cues": [{"s": "「這叫做固碳魔法！」", "t": 0.1}, {"s": "木木驕傲地說。", "t": 1.9}, {"s": "樹木在行光合作用時，會把空氣中過多的二氧化碳深深吸進身體裡，轉化成堅固的木材儲存起來（固碳），並釋放出清新乾淨的氧氣（O₂），幫地球退燒減碳！", "t": 4.17}, {"s": "學習小提問：樹木吸進二氧化碳後儲存在木材裡，這個神奇過程叫作什麼魔法呢？", "t": 20.24}]}, {"cues": [{"s": "晴晴驚喜地拍拍手：「太厲害了！", "t": 0.1}, {"s": "那我也能成為幫地球減碳的小英雄嗎？」", "t": 4.09}, {"s": "木木點點頭說：「當然可以呀！", "t": 7.5}, {"s": "只要在日常生活中隨手做減碳的小事情，你就是最棒的減碳夥伴！」", "t": 11.11}, {"s": "學習小提問：想一想，你在家裡或學校裡，可以做到哪些減少二氧化碳的小動作呢？", "t": 17.34}]}, {"cues": [{"s": "晴晴決定成為稱職的「國際小公民」。", "t": 0.1}, {"s": "她開始養成出門隨身攜帶環保餐具與水壺的好習慣，不隨意浪費電力，還常常走路或騎腳踏車上學，減少二氧化碳的排放。", "t": 4.18}, {"s": "減碳小承諾：這四項減碳行動中，你最常做到的是哪一項？", "t": 16.89}, {"s": "你今天準備開始嘗試哪一項呢？", "t": 23.42}]}, {"cues": [{"s": "在美麗的海岸線邊，木木與防風林夥伴們依然挺立著擋風固砂、把碳鎖在樹木裡；而在城鎮中，晴晴與小朋友們正用日常減碳行動守護家園。", "t": 0.1}, {"s": "大家攜手努力，一起當守護綠色地球的國際小公民！", "t": 14.21}]}], "ending": {"heading": "課堂總結", "source": "濱海綠寶石校訂課程　單元一：海與木麻黃／單元二：樹與碳—能有一套", "questions": ["木麻黃看起來像針葉的構造，其實是什麼？", "防風林是怎麼保護後方的農田和城鎮？", "樹木的「固碳魔法」把二氧化碳存到哪裡去了？"], "cues": [{"s": "讓我們一起向樹木學習，保護海岸綠寶石，並從日常生活做個稱職的減碳小英雄！", "t": 0.1}]}};
</script>
<script>
/* 狀態 s = 已翻過的紙張數：0 封面、1..N 故事頁、N+1 結尾頁（可省略）、最後是封底 */
const N=BOOK.pages.length,END=BOOK.ending,LAST=N+(END?2:1);
document.documentElement.style.setProperty('--r',BOOK.ratio);
const book=document.getElementById('book'),$=id=>document.getElementById(id);
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
/* 注音：開頭標點黏下一字、結尾標點黏上一字，避免標點落單在行首行尾 */
const bpHTML=z=>{
  if(!z) return '';
  const dot=z[0]==='˙',tone=/[ˊˇˋ]$/.exec(z);
  const syms=[...z.replace(/[˙ˊˇˋ]/g,'')].map(c=>`<i>${c}</i>`).join('');
  return `<span class="bp">${dot?'<span class="dot">˙</span>':''}${syms}${tone?`<span class="tn">${tone[0]}</span>`:''}</span>`;
};
function T(str){
  const zs=BOOK.zhuyin&&BOOK.zhuyin[str];
  if(!zs) return esc(str);
  const chars=[...str],groups=[];let open='';
  chars.forEach((c,i)=>{
    const cell=`<span class="zc">${esc(c)}${bpHTML(zs[i])}</span>`;
    if(/[「『（《〈]/.test(c)){open+=cell;return}
    if(!zs[i]&&groups.length&&!open) groups[groups.length-1]+=cell;
    else{groups.push(open+cell);open=''}
  });
  if(open) groups.push(open);
  return groups.map(g=>`<span class="zg">${g}</span>`).join('');
}
const cueHTML=(cues,t)=>cues.map((c,k)=>`<span class="cue" data-p="${t}" data-k="${k}">${T(c.s)}</span>`).join('');
if(BOOK.zhuyin) document.body.classList.add('zy');
const artHTML=(n,cls)=>`<div class="art ${cls}"><div class="missing">插圖尚未放入<br>images/p${pad(n)}.jpg</div><img alt="" src="images/p${pad(n)}.jpg" onerror="this.remove()"></div>`;
const textHTML=n=>`<div class="txt"><p class="story">${cueHTML(BOOK.pages[n-1].cues,n)}</p><div class="pno">第 ${n} 頁</div></div>`;
const plainCover=`<div class="plain"><h1>${esc(BOOK.title)}</h1>${BOOK.subtitle?`<p>${esc(BOOK.subtitle)}</p>`:''}</div>`;
/* 封面圖本身通常已含書名，所以有圖就不再疊字；圖片載入失敗才顯示純文字封面 */
const coverHTML=()=>`<div class="cover">${plainCover}<div class="blur" style="background-image:url(images/p00.jpg)"></div><img src="images/p00.jpg" alt="${esc(BOOK.title)}封面" onerror="this.previousElementSibling.remove();this.remove()">${BOOK.cover_title?`<h1 class="ctitle">${T(BOOK.title)}</h1>`:''}</div>`;
const endA=()=>`<div class="txt end"><h2>${T(END.heading)}</h2><p class="story">${cueHTML(END.cues,N+1)}</p>${END.source?`<p class="src">出處：${T(END.source)}</p>`:''}</div>`;
const endB=()=>`<div class="txt end"><h2>想一想</h2><ol>${(END.questions||[]).map(q=>`<li>${T(q)}</li>`).join('')}</ol></div>`;
const endBoth=()=>`<div class="end" style="position:absolute;inset:0"><div class="txt"><h2>${T(END.heading)}</h2><p class="story">${cueHTML(END.cues,N+1)}</p>${END.source?`<p class="src">出處：${T(END.source)}</p>`:''}${(END.questions||[]).length?`<ol>${END.questions.map(q=>`<li>${T(q)}</li>`).join('')}</ol>`:''}</div></div>`;
const backHTML=()=>`<div class="backcover"><h2>${T(BOOK.closing||'故事說完了')}</h2>${BOOK.thanks?`<p>${T(BOOK.thanks)}</p>`:''}<button class="again" data-again>↺ 再看一次</button></div>`;

let single=false,s=0;
const leafEl=(front,back)=>`<div class="leaf"><div class="face front">${front}</div><div class="face back">${back}</div></div>`;
function build(){
  let html='';
  if(single){
    const pages=[coverHTML()];
    for(let n=1;n<=N;n++) pages.push(`<div class="sp">${artHTML(n,'top')}${textHTML(n)}</div>`);
    if(END) pages.push(endBoth());
    pages.push(backHTML());
    html=pages.map(p=>leafEl(p,'')).join('');
  }else{
    /* 第 i 張紙：正面在右、背面在左；翻過 s 張時左右兩面正好是第 s 個跨頁 */
    html+=leafEl(coverHTML(),artHTML(1,'plate'));
    for(let n=1;n<N;n++) html+=leafEl(textHTML(n),artHTML(n+1,'plate'));
    if(END){html+=leafEl(textHTML(N),endA());html+=leafEl(endB(),backHTML())}
    else html+=leafEl(textHTML(N),backHTML());
  }
  book.innerHTML=html;
  render(true);
  fitText();
}
/* 文字超出頁面時逐步縮小，故事長短不一也不會被切掉。
   內容是垂直置中，往上溢出不計入 scrollHeight，所以直接比內容高度與可用高度 */
function overflows(t){
  const cs=getComputedStyle(t);let h=0;
  for(const c of t.children){
    const m=getComputedStyle(c);
    if(m.position!=='absolute') h+=c.offsetHeight+parseFloat(m.marginTop)+parseFloat(m.marginBottom);
  }
  return h>t.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)+1;
}
function fitText(){
  book.querySelectorAll('.txt').forEach(t=>{
    let f=1;t.style.setProperty('--fit',1);
    while(overflows(t)&&f>.55){f-=.05;t.style.setProperty('--fit',f)}
  });
}
function updateBar(){
  $('prev').disabled=s===0;
  $('next').disabled=s===LAST;
  $('label').textContent=s===0?'封面':s<=N?`第 ${s} / ${N} 頁`:s===LAST?'封底':'想一想';
}
function setShift(){
  book.classList.toggle('at-front',!single&&s===0);
  book.classList.toggle('at-back',!single&&s===LAST);
}
function render(instant){
  const ls=[...book.children];
  if(instant) book.style.transition='none';
  ls.forEach((l,i)=>{
    if(instant) l.style.transition='none';
    l.classList.toggle('flipped',i<s);
    l.style.zIndex=i<s?i:ls.length-i;
    if(instant){void l.offsetWidth;l.style.transition=''}
  });
  setShift();
  if(instant){void book.offsetWidth;book.style.transition=''}
  updateBar();
}

/* ---------- 翻頁與旁白 ---------- */
const audio=new Audio();audio.preload='auto';
let voiceOn=true,autoOn=true,started=false,timer=null;
const btnPlay=$('play');
const track=()=>s<LAST?s:null;
const cuesOf=t=>t===0?BOOK.coverCues:t<=N?BOOK.pages[t-1].cues:END.cues;
function clearHL(){book.querySelectorAll('.cue.on').forEach(e=>e.classList.remove('on'))}
function setPlayLabel(){btnPlay.textContent=!audio.paused?'⏸ 暫停':s===LAST?'↺ 再聽一次':started?'▶ 繼續':'▶ 開始聽故事'}
function stopAudio(){audio.pause();clearTimeout(timer);clearHL();setPlayLabel()}
function playCurrent(){
  const t=track();
  if(t===null||!voiceOn){setPlayLabel();return}
  const src=`audio/p${pad(t)}.mp3`;
  if(!audio.src.endsWith(src)) audio.src=src;
  audio.currentTime=0;
  audio.play().then(setPlayLabel).catch(setPlayLabel);
}
function go(to,speak=true){
  to=Math.max(0,Math.min(LAST,to));
  if(to===s) return;
  stopAudio();
  const ls=[...book.children],a=Math.min(s,to),b=Math.max(s,to);
  /* 正在翻的紙暫時放到最上層 */
  ls.forEach((l,i)=>{if(i>=a&&i<b) l.style.zIndex=ls.length+b-i});
  s=to;
  ls.forEach((l,i)=>l.classList.toggle('flipped',i<s));
  setShift();updateBar();
  const mine=++go.id;
  setTimeout(()=>{if(mine===go.id) render(false)},880);
  if(speak&&started&&voiceOn) timer=setTimeout(playCurrent,900);
}
go.id=0;
audio.addEventListener('timeupdate',()=>{
  const t=track();if(t===null) return;
  let k=0;cuesOf(t).forEach((c,i)=>{if(audio.currentTime>=c.t) k=i});
  book.querySelectorAll('.cue').forEach(e=>e.classList.toggle('on',+e.dataset.p===t&&+e.dataset.k===k));
});
audio.addEventListener('play',setPlayLabel);
audio.addEventListener('pause',setPlayLabel);
audio.addEventListener('ended',()=>{
  clearHL();setPlayLabel();
  if(autoOn&&s<LAST) timer=setTimeout(()=>go(s+1),1000);
});
btnPlay.onclick=()=>{
  clearTimeout(timer);
  if(!audio.paused){audio.pause();return}
  if(!voiceOn){voiceOn=true;syncToggles()}
  if(s===LAST){started=true;go(0);return}
  const resume=started&&audio.currentTime>0&&!audio.ended&&audio.src.endsWith(`p${pad(track())}.mp3`);
  started=true;
  if(resume) audio.play().catch(setPlayLabel); else playCurrent();
};
function syncToggles(){
  $('voice').setAttribute('aria-pressed',voiceOn);
  $('auto').setAttribute('aria-pressed',autoOn);
}
$('prev').onclick=()=>go(s-1);
$('next').onclick=()=>go(s+1);
$('voice').onclick=()=>{voiceOn=!voiceOn;syncToggles();if(!voiceOn) stopAudio()};
$('auto').onclick=()=>{autoOn=!autoOn;syncToggles()};
let px=null,swiped=false;
book.addEventListener('click',e=>{
  if(e.target.closest('[data-again]')){go(0,false);stopAudio();return}
  if(swiped){swiped=false;return}
  const r=book.getBoundingClientRect();
  (single?e.clientX>r.left+r.width*.35:e.clientX>r.left+r.width/2)?go(s+1):go(s-1);
});
book.addEventListener('pointerdown',e=>{px=e.clientX;swiped=false});
book.addEventListener('pointerup',e=>{
  if(px===null) return;const d=e.clientX-px;px=null;
  if(Math.abs(d)>50){swiped=true;go(s+(d<0?1:-1))}
});
addEventListener('keydown',e=>{
  if(e.target.tagName==='BUTTON'&&e.key===' ') return;
  if(e.key==='ArrowRight') go(s+1);
  else if(e.key==='ArrowLeft') go(s-1);
  else if(e.key===' '){e.preventDefault();btnPlay.click()}
});
/* 直式窄螢幕切單頁 */
const mq=matchMedia('(max-aspect-ratio: 1/1)');
function applyMode(){single=mq.matches;document.body.classList.toggle('single',single);stopAudio();build()}
mq.addEventListener('change',applyMode);
addEventListener('resize',fitText);
applyMode();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitText);
</script>
